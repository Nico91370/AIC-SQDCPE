# Déploiement de test sur Render.com (Blueprint) : application + base PostgreSQL gratuites.
# Render → New → Blueprint → choisir ce dépôt. Un code d'accès est demandé à la création.
services:
  - type: web
    name: aic-sqdcpe
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: aic-sqdcpe-db
          property: connectionString
      - key: AUTH_MODE
        value: dev
      - key: ACCESS_CODE
        sync: false
      - key: DEFAULT_ROLE
        value: animateur
databases:
  - name: aic-sqdcpe-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
